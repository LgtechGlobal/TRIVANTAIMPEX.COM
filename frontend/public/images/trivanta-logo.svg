<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none">
  <defs>
    <!-- Dark navy gradient for T and I -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a72"/>
      <stop offset="100%" stop-color="#0d1f4a"/>
    </linearGradient>
    <!-- Bright blue gradient for arc -->
    <linearGradient id="arcGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#29abe2"/>
      <stop offset="40%" stop-color="#1e90d8"/>
      <stop offset="100%" stop-color="#29abe2"/>
    </linearGradient>
    <!-- Cyan gradient for triangles -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29d4f5"/>
      <stop offset="100%" stop-color="#0aace0"/>
    </linearGradient>
    <!-- Buildings gradient -->
    <linearGradient id="buildGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2255a0"/>
      <stop offset="100%" stop-color="#0d1f4a"/>
    </linearGradient>
  </defs>

  <!-- ══════════════ BIG "T" ══════════════ -->
  <!-- Horizontal bar of T -->
  <rect x="28" y="85" width="248" height="62" rx="6" fill="url(#navyGrad)"/>
  <!-- Vertical stem of T -->
  <rect x="102" y="85" width="68" height="242" rx="5" fill="url(#navyGrad)"/>

  <!-- ══════════════ CITY SKYLINE above "I" ══════════════ -->
  <!-- Buildings group, sitting above the I column -->
  <!-- Tallest center building -->
  <rect x="340" y="28" width="36" height="86" rx="3" fill="url(#buildGrad)"/>
  <!-- Left tall building -->
  <rect x="316" y="48" width="28" height="66" rx="3" fill="url(#buildGrad)"/>
  <!-- Right tall building -->
  <rect x="372" y="44" width="28" height="70" rx="3" fill="url(#buildGrad)"/>
  <!-- Far left short building -->
  <rect x="296" y="68" width="22" height="46" rx="2" fill="url(#buildGrad)"/>
  <!-- Far right short building -->
  <rect x="398" y="62" width="24" height="52" rx="2" fill="url(#buildGrad)"/>
  <!-- Building windows (bright lines) -->
  <rect x="346" y="34" width="4" height="8" rx="1" fill="#5aa8e8" opacity="0.7"/>
  <rect x="356" y="34" width="4" height="8" rx="1" fill="#5aa8e8" opacity="0.7"/>
  <rect x="346" y="48" width="4" height="8" rx="1" fill="#5aa8e8" opacity="0.7"/>
  <rect x="356" y="48" width="4" height="8" rx="1" fill="#5aa8e8" opacity="0.7"/>

  <!-- ══════════════ "I" BODY ══════════════ -->
  <!-- I left face (dark navy slab) -->
  <rect x="298" y="114" width="48" height="210" rx="4" fill="url(#navyGrad)"/>
  <!-- I right face (slightly lighter navy for depth) -->
  <rect x="344" y="114" width="72" height="210" rx="4" fill="#112355"/>

  <!-- ══════════════ CYAN CHEVRON ARROWS inside I ══════════════ -->
  <!-- Arrow 1 (top) -->
  <polygon points="308,150  338,150  352,172  338,194  308,194  322,172" fill="url(#cyanGrad)"/>
  <!-- Arrow 2 (middle) -->
  <polygon points="308,204  338,204  352,226  338,248  308,248  322,226" fill="url(#cyanGrad)"/>
  <!-- Arrow 3 (bottom) -->
  <polygon points="308,258  338,258  352,280  338,302  308,302  322,280" fill="url(#cyanGrad)"/>

  <!-- ══════════════ SWOOPING ORBITAL ARC ══════════════ -->
  <!-- Main arc stroke — goes from bottom-left, sweeps up right, curves back around -->
  <!-- Lower arc (underneath, left to right) -->
  <path
    d="M 60 310 Q 180 370 320 330 Q 420 300 480 250"
    stroke="url(#arcGrad)"
    stroke-width="22"
    stroke-linecap="round"
    fill="none"
    opacity="0.95"
  />
  <!-- Upper arc (sweeping over from left side) -->
  <path
    d="M 42 270 Q 100 180 240 168 Q 340 160 430 190"
    stroke="url(#arcGrad)"
    stroke-width="14"
    stroke-linecap="round"
    fill="none"
    opacity="0.85"
  />
  <!-- Arc tip right side (thinner tail going up-right) -->
  <path
    d="M 430 190 Q 475 175 490 210 Q 498 235 480 250"
    stroke="url(#arcGrad)"
    stroke-width="10"
    stroke-linecap="round"
    fill="none"
    opacity="0.8"
  />
  <!-- Arc left-side thinner entry -->
  <path
    d="M 42 270 Q 28 290 60 310"
    stroke="url(#arcGrad)"
    stroke-width="10"
    stroke-linecap="round"
    fill="none"
    opacity="0.8"
  />
</svg>
